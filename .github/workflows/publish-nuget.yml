name: Release Build and Publish NuGet Package

on:
  push:
    branches:
      - 'release/**'
      - 'release/*'
      - 'release-*'
      - 'releases/**'
      - 'releases/*'
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package/Release Version (e.g., 1.0.1, leave empty to auto-calculate)'
        required: false
        type: string
      push_to_nuget:
        description: 'Push package to NuGet.org'
        required: false
        type: boolean
        default: true
      push_to_github:
        description: 'Push package to GitHub Packages'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-pack:
    name: Build, Test, and Release NuGet Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: version_step
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}"
          if (-not [string]::IsNullOrWhiteSpace($inputVer)) {
            $ver = $inputVer
          } else {
            $branch = "${{ github.ref_name }}"
            $ver = $branch -replace '^releases?/', '' -replace '^releases?-', ''
            if (-not $ver -or $ver -eq $branch) {
              $ver = "${{ github.run_number }}"
            }
          }
          # Strip leading v, V, and any leading dot (e.g. v.1.3.0 -> 1.3.0, v1.3.0 -> 1.3.0)
          $rawVer = $ver -replace '^[vV]\.?|^\.', ''
          $ver = "v$rawVer"
          Write-Host "Calculated version: $ver (raw: $rawVer)"
          echo "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV
          echo "RAW_VERSION=$rawVer" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore VellumUI.sln

      - name: Build Solution
        run: dotnet build VellumUI.sln -c Release --no-restore /p:Version=${{ env.RAW_VERSION }} /p:PackageVersion=${{ env.RAW_VERSION }} /p:AssemblyVersion=${{ env.RAW_VERSION }} /p:FileVersion=${{ env.RAW_VERSION }}

      - name: Run Tests
        run: dotnet test tests/VellumUi.Tests/VellumUi.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack VellumUI NuGet package
        run: |
          dotnet pack src/VellumUI/VellumUI.csproj -c Release --no-build /p:Version=${{ env.RAW_VERSION }} /p:PackageVersion=${{ env.RAW_VERSION }} /p:AssemblyVersion=${{ env.RAW_VERSION }} /p:FileVersion=${{ env.RAW_VERSION }} -o ./artifacts/nuget

      - name: Upload NuGet Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VellumUI-nuget-packages
          path: ./artifacts/nuget/*

      - name: Push to NuGet.org
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_nuget != 'false'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Warning "NUGET_API_KEY secret is not set. Skipping push to NuGet.org."
          } else {
            Get-ChildItem -Path ./artifacts/nuget -Filter *.nupkg | ForEach-Object {
              dotnet nuget push $_.FullName --api-key "$env:NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
            }
          }

      - name: Push to GitHub Packages
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_to_github != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Get-ChildItem -Path ./artifacts/nuget -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key "$env:GITHUB_TOKEN" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate --no-symbols
          }

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/nuget/*.nupkg
            ./artifacts/nuget/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
