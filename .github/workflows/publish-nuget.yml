name: Publish VellumUI NuGet Package

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
    branches:
      - main
      - 'release/**'
      - 'release/*'
      - 'release-*'
      - 'releases/**'
      - 'releases/*'
    paths:
      - 'src/VellumUI/**'
      - '.github/workflows/publish-nuget.yml'
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'release/*'
      - 'release-*'
      - 'releases/**'
      - 'releases/*'
    paths:
      - 'src/VellumUI/**'
      - '.github/workflows/publish-nuget.yml'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version (e.g., 1.0.1, leave empty to use auto-calculated version)'
        required: false
        type: string
      push_to_nuget:
        description: 'Push package to NuGet.org'
        required: true
        type: boolean
        default: true
      push_to_github:
        description: 'Push package to GitHub Packages'
        required: true
        type: boolean
        default: false

jobs:
  build-and-pack:
    name: Build, Test & Pack VellumUI
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract Version
        id: get_version
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}"
          if (-not [string]::IsNullOrWhiteSpace($inputVer)) {
            $version = $inputVer
          } else {
            $releaseTag = "${{ github.event.release.tag_name }}"
            if (-not [string]::IsNullOrWhiteSpace($releaseTag)) {
              $version = $releaseTag
            } elseif ($env:GITHUB_REF -like "refs/tags/*") {
              $version = $env:GITHUB_REF -replace '^refs/tags/', ''
            } else {
              $branch = "${{ github.ref_name }}"
              $version = $branch -replace '^releases?/', '' -replace '^releases?-', ''
            }
          }

          if ($version.StartsWith("v") -or $version.StartsWith("V")) {
            $tagVer = $version
            $rawVer = $version.Substring(1)
          } else {
            $tagVer = "v$version"
            $rawVer = $version
          }

          if (-not [string]::IsNullOrWhiteSpace($rawVer) -and $rawVer -ne $branch) {
            Write-Host "Using explicit version: $rawVer (tag: $tagVer)"
            echo "VERSION_FLAG=/p:Version=$rawVer /p:PackageVersion=$rawVer /p:AssemblyVersion=$rawVer /p:FileVersion=$rawVer" >> $env:GITHUB_ENV
            echo "RELEASE_VERSION=$tagVer" >> $env:GITHUB_ENV
            echo "VERSION=$rawVer" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Using project default version"
            echo "VERSION_FLAG=" >> $env:GITHUB_ENV
            echo "RELEASE_VERSION=v${{ github.run_number }}" >> $env:GITHUB_ENV
            echo "VERSION=" >> $env:GITHUB_OUTPUT
          }

      - name: Restore dependencies
        run: dotnet restore VellumUI.sln

      - name: Build solution
        run: dotnet build VellumUI.sln -c Release --no-restore $env:VERSION_FLAG

      - name: Run unit tests
        run: dotnet test tests/VellumUi.Tests/VellumUi.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack VellumUI NuGet package
        run: |
          dotnet pack src/VellumUI/VellumUI.csproj -c Release --no-build $env:VERSION_FLAG -o ./artifacts/nuget

      - name: Upload NuGet Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VellumUI-nuget-packages
          path: ./artifacts/nuget/*

      - name: Push to NuGet.org
        if: |
          github.event_name == 'release' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_nuget == 'true')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            Write-Warning "NUGET_API_KEY secret is not set. Skipping push to NuGet.org."
          } else {
            dotnet nuget push "./artifacts/nuget/*.nupkg" --api-key "$env:NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          }

      - name: Push to GitHub Packages
        if: |
          github.event_name == 'release' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_github == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name "github" --username "${{ github.repository_owner }}" --password "$env:GITHUB_TOKEN" --store-password-in-clear-text
          dotnet nuget push "./artifacts/nuget/*.nupkg" --source "github" --skip-duplicate

      - name: Create or Attach to GitHub Release
        if: |
          github.event_name == 'release' ||
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/heads/release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ./artifacts/nuget/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
