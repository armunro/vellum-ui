name: Release Build and Publish Demo

on:
  push:
    branches:
      - 'release/**'
      - 'release/*'
      - 'release-*'
      - 'releases/**'
      - 'releases/*'
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package/Release Version (e.g., 1.0.1, leave empty to auto-calculate)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test, and Release Demo (${{ matrix.target.rid }})
    runs-on: windows-latest

    strategy:
      matrix:
        target:
          - rid: win-x64
            name: Windows x64
          - rid: win-arm64
            name: Windows ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: version_step
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}"
          if (-not [string]::IsNullOrWhiteSpace($inputVer)) {
            $ver = $inputVer
          } else {
            $branch = "${{ github.ref_name }}"
            $ver = $branch -replace '^releases?/', '' -replace '^releases?-', ''
            if (-not $ver -or $ver -eq $branch) {
              $ver = "${{ github.run_number }}"
            }
          }
          # Strip leading v, V, and any leading dot (e.g. v.1.3.0 -> 1.3.0, v1.3.0 -> 1.3.0)
          $rawVer = $ver -replace '^[vV]\.?|^\.', ''
          $ver = "v$rawVer"
          Write-Host "Calculated version: $ver (raw: $rawVer)"
          echo "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV
          echo "RAW_VERSION=$rawVer" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore VellumUI.sln

      - name: Build Solution
        run: dotnet build VellumUI.sln -c Release --no-restore /p:Version=${{ env.RAW_VERSION }} /p:AssemblyVersion=${{ env.RAW_VERSION }} /p:FileVersion=${{ env.RAW_VERSION }}

      - name: Run Tests
        run: dotnet test tests/VellumUi.Tests/VellumUi.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish WPF Demo App (${{ matrix.target.rid }} self-contained)
        run: |
          dotnet publish src/VellumUI.Demo/VellumUI.Demo.csproj -c Release -r ${{ matrix.target.rid }} --self-contained true -p:Version=${{ env.RAW_VERSION }} -o ./publish/${{ matrix.target.rid }}

      - name: Publish Single-File Executable (${{ matrix.target.rid }} self-contained)
        run: |
          dotnet publish src/VellumUI.Demo/VellumUI.Demo.csproj -c Release -r ${{ matrix.target.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.RAW_VERSION }} -o ./publish/single-file-${{ matrix.target.rid }}

      - name: Package Release Assets
        shell: pwsh
        run: |
          $zipName = "VellumUI.Demo-${{ env.RELEASE_VERSION }}-${{ matrix.target.rid }}.zip"
          Compress-Archive -Path ./publish/${{ matrix.target.rid }}/* -DestinationPath "./$zipName"
          Write-Host "Created $zipName"

          $singleExeName = "VellumUI.Demo-${{ env.RELEASE_VERSION }}-${{ matrix.target.rid }}.exe"
          Copy-Item -Path ./publish/single-file-${{ matrix.target.rid }}/VellumUI.Demo.exe -Destination "./$singleExeName"
          Write-Host "Created $singleExeName"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            VellumUI.Demo-*-${{ matrix.target.rid }}.zip
            VellumUI.Demo-*-${{ matrix.target.rid }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
